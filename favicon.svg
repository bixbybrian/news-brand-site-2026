<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#1A1410"/>

  <!-- Outer circle -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#D4A97A" stroke-width="0.8" opacity="0.6"/>

  <!-- Inner circle -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#D4A97A" stroke-width="0.5" opacity="0.35"/>

  <!-- Cardinal cross lines -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#D4A97A" stroke-width="0.5" opacity="0.3"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="#D4A97A" stroke-width="0.5" opacity="0.3"/>

  <!-- N arrow (bright, pointing up) -->
  <polygon points="16,3 14.2,12 16,10.5 17.8,12" fill="#D4A97A"/>

  <!-- S arrow (dim) -->
  <polygon points="16,29 14.2,20 16,21.5 17.8,20" fill="#D4A97A" opacity="0.35"/>

  <!-- E arrow (dim) -->
  <polygon points="29,16 20,14.2 21.5,16 20,17.8" fill="#D4A97A" opacity="0.35"/>

  <!-- W arrow (dim) -->
  <polygon points="3,16 12,14.2 10.5,16 12,17.8" fill="#D4A97A" opacity="0.35"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#D4A97A"/>
</svg>
