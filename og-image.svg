<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&amp;family=DM+Mono:wght@0,400&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1A1410"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#D4A97A" stroke-width="0.8">
    <!-- Vertical lines every 40px -->
    <line x1="40"  y1="0" x2="40"  y2="630"/>
    <line x1="80"  y1="0" x2="80"  y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <!-- Horizontal lines every 40px -->
    <line x1="0" y1="40"  x2="1200" y2="40"/>
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Large ghost compass rose (centered right) -->
  <g transform="translate(880, 315)" opacity="0.09" stroke="#D4A97A" fill="none">
    <circle r="260" stroke-width="1"/>
    <circle r="200" stroke-width="0.6"/>
    <circle r="120" stroke-width="0.6"/>
    <circle r="40"  stroke-width="0.6"/>
    <line x1="0" y1="-280" x2="0" y2="280" stroke-width="0.8"/>
    <line x1="-280" y1="0" x2="280" y2="0" stroke-width="0.8"/>
    <line x1="-198" y1="-198" x2="198" y2="198" stroke-width="0.4"/>
    <line x1="198" y1="-198" x2="-198" y2="198" stroke-width="0.4"/>
    <!-- N arrow -->
    <polygon points="0,-268 -10,-220 0,-240 10,-220" fill="#D4A97A" stroke="none" opacity="1"/>
    <!-- S arrow -->
    <polygon points="0,268 -10,220 0,240 10,220" fill="#D4A97A" stroke="none" opacity="0.5"/>
    <!-- E arrow -->
    <polygon points="268,0 220,-10 240,0 220,10" fill="#D4A97A" stroke="none" opacity="0.5"/>
    <!-- W arrow -->
    <polygon points="-268,0 -220,-10 -240,0 -220,10" fill="#D4A97A" stroke="none" opacity="0.5"/>
    <!-- Center -->
    <circle r="5" fill="#D4A97A" stroke="none" opacity="1"/>
    <!-- Cardinal labels -->
    <text x="0" y="-248" font-family="Georgia, serif" font-size="18" fill="#D4A97A" text-anchor="middle" opacity="0.7">N</text>
    <text x="0" y="262" font-family="Georgia, serif" font-size="18" fill="#D4A97A" text-anchor="middle" opacity="0.4">S</text>
    <text x="252" y="6" font-family="Georgia, serif" font-size="18" fill="#D4A97A" text-anchor="middle" opacity="0.4">E</text>
    <text x="-252" y="6" font-family="Georgia, serif" font-size="18" fill="#D4A97A" text-anchor="middle" opacity="0.4">W</text>
  </g>

  <!-- Left content area -->
  <!-- Eyebrow label -->
  <text x="80" y="228" font-family="'Courier New', monospace" font-size="13" fill="#D4A97A" letter-spacing="5" opacity="0.65">NORTH · EAST · WEST · SOUTH</text>

  <!-- Main wordmark -->
  <text x="72" y="420" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="248" fill="#F5F0E8" letter-spacing="-4">NEWS</text>

  <!-- Tagline -->
  <text x="82" y="490" font-family="'Courier New', monospace" font-size="15" fill="#F5F0E8" letter-spacing="3" opacity="0.4">RESPONSIBLY MADE · DESIGNED TO GIVE BACK</text>

  <!-- Kraft divider line -->
  <line x1="80" y1="248" x2="280" y2="248" stroke="#D4A97A" stroke-width="1" opacity="0.4"/>

  <!-- Border frame -->
  <rect x="12" y="12" width="1176" height="606" fill="none" stroke="#D4A97A" stroke-width="0.8" opacity="0.18"/>
</svg>
